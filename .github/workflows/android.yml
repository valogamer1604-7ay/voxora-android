name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack signing key (stored in GitHub Secrets, never in the code)
        env:
          KS: ${{ secrets.VOXORA_KEYSTORE }}
        run: echo "$KS" | base64 -d > $RUNNER_TEMP/voxora.p12

      - name: Build signed release APK
        env:
          VOXORA_KEYSTORE_FILE: ${{ runner.temp }}/voxora.p12
          VOXORA_KEY_PASSWORD: ${{ secrets.VOXORA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Voxora.apk
          rm -f $RUNNER_TEMP/voxora.p12
          sha256sum Voxora.apk | tee Voxora.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Voxora-apk
          path: |
            Voxora.apk
            Voxora.apk.sha256

      - name: Publish to Releases (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Voxora.apk Voxora.apk.sha256 \
            --title "Voxora - latest build" \
            --notes "Signed release build from commit ${GITHUB_SHA::7}. Download Voxora.apk on your Android phone and install it. If you installed an older test build, uninstall it first."
